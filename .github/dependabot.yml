version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      # Keep Bun types on the minimum supported runtime (engines.bun) so newer
      # Bun APIs fail typechecking instead of breaking Bun 1.3.14 users.
      - dependency-name: "@types/bun"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must stay on the same CodeQL Action release.
      codeql-action:
        patterns:
          - github/codeql-action*
